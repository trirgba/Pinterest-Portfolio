<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container" style="display: flex; align-items: center; position: relative; min-height: 40px;">
      <!-- Left: Back button -->
      <a href="/" id="back-btn" class="back-btn" aria-label="Quay lại">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>

      <!-- Center: Title & Count -->
      <div style="position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; white-space: nowrap; font-size: 16px; font-weight: 500;">
        <h1 id="project-title" class="project-detail-title" style="margin: 0; font-size: inherit; font-weight: inherit;">Đang tải...</h1>
        <span id="project-count" class="project-detail-count" style="font-weight: 400; margin-left: 6px;"></span>
      </div>

      <!-- Right: Edit button (Admin only) -->
      <a href="#" id="edit-project-btn" class="back-btn" aria-label="Chỉnh sửa" style="display: none; margin-left: auto;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
      </a>
    </div>
  </header>

  <!-- Mosaic Grid -->
  <main class="container" style="padding-top: 24px; padding-bottom: 64px;">
    <div id="mosaic-grid" class="mosaic-grid"></div>
  </main>

  <!-- Footer Global -->
  <footer id="global-footer"></footer>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox-overlay">
    <button class="lightbox-close" aria-label="Đóng">✕</button>
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Full size" style="display: none;">
    <iframe id="lightbox-iframe" style="display: none; width: 80vw; height: 80vh; max-width: 1280px; max-height: 720px; border: none; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <script type="module">
    import './src/main.js?v=3';
    import { initProjectPage } from './src/pages/project.js?v=3';
    import { renderGlobalFooter } from './src/components/footer.js';
    renderGlobalFooter();
    initProjectPage();
  </script>
</body>
